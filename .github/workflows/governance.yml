name: governance
on:
  pull_request:
  push:
    branches: [main]
jobs:
  source-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical governance
        shell: bash
        run: |
          set -euo pipefail
          required=(AGENTS.md .engineering/CHECKPOINT.md docs/source-pack/SOURCE-HIERARCHY.md docs/source-pack/PROJECT-OVERVIEW.md docs/source-pack/REQUIREMENTS.md docs/source-pack/SCOPE.md docs/source-pack/ARCHITECTURE.md docs/source-pack/SECURITY.md docs/source-pack/TEST-BENCHMARK-PLAN.md docs/source-pack/DEPLOYMENT.md docs/source-pack/BACKLOG.md docs/source-pack/DEFINITION-OF-DONE.md docs/source-pack/DECISIONS.md)
          for f in "${required[@]}"; do test -s "$f" || { echo "Missing/empty: $f"; exit 1; }; done
          grep -q HIGH_ASSURANCE AGENTS.md
          grep -q "Git is canonical" docs/source-pack/DECISIONS.md
          grep -q "Hive V1" .engineering/integrations/HIVE-V1.md